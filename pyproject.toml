[project]
name = "str-deal-intelligence"
version = "0.1.0"
description = "Dual-report STR deal evaluator: internal underwriting brief + owner outreach pitch, from a single property address"
authors = [{ name = "Alessandro Garcia-Alario" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,anthropic]>=0.100.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[tool.crewai]
type = "crew"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/str_deal_intelligence"]

[project.scripts]
run_crew = "str_deal_intelligence.main:run"
plot_crew = "str_deal_intelligence.main:plot"
